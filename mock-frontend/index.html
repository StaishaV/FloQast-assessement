<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FloQast Mock Bank</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Mock Bank</h1>
    </header>

    <section id="account-section" data-testid="account-section">
      <div id="register-form-container">
        <h2>Create Account</h2>
        <form id="register-form" data-testid="register-form" novalidate>
          <label for="name">Full name</label>
          <input id="name" name="name" data-testid="name-input" />

          <label for="email">Email</label>
          <input id="email" name="email" data-testid="email-input" />

          <label for="accountType">Account type</label>
          <select id="accountType" name="accountType" data-testid="account-type-select">
            <option value="basic">Basic</option>
            <option value="premium">Premium</option>
          </select>

          <button type="submit" data-testid="register-submit">Create account</button>
        </form>
        <p class="error" id="register-error" data-testid="register-error" hidden></p>
      </div>

      <div id="current-user-container" data-testid="current-user-container" hidden>
        <p>
          Logged in as <strong><span id="current-user-name" data-testid="current-user-name"></span></strong>
          (<span id="current-user-id" data-testid="current-user-id"></span>)
        </p>
        <button id="logout-button" data-testid="logout-button">Log out</button>
      </div>
    </section>

    <section id="transaction-section" data-testid="transaction-section" hidden>
      <h2>Send a Transaction</h2>
      <form id="transaction-form" data-testid="transaction-form" novalidate>
        <label for="recipientId">Recipient user ID</label>
        <input id="recipientId" name="recipientId" data-testid="recipient-id-input" />

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" step="0.01" data-testid="amount-input" />

        <label for="type">Type</label>
        <select id="type" name="type" data-testid="type-select">
          <option value="transfer">Transfer</option>
          <option value="payment">Payment</option>
          <option value="deposit">Deposit</option>
          <option value="withdrawal">Withdrawal</option>
        </select>

        <button type="submit" data-testid="transaction-submit">Send</button>
      </form>
      <p class="error" id="transaction-error" data-testid="transaction-error" hidden></p>
      <p class="success" id="transaction-success" data-testid="transaction-success" hidden></p>

      <h3>Transaction History</h3>
      <button id="refresh-transactions" data-testid="refresh-transactions" type="button">Refresh</button>
      <ul id="transaction-list" data-testid="transaction-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
